# Build + publish to GHCR, tracking the official upstream release.
# The dsh version is NOT pinned: each run resolves npm's `latest`
# dist-tag for @deepseek-ai/dsh (the same version `npx @deepseek-ai/dsh`
# installs), builds that exact version, and tags the image with it.
# A weekly scheduled run picks up new upstream releases automatically.
name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "DSH version to build (empty = npm latest)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream dsh version
        id: resolve
        run: |
          if [ -n "${{ inputs.dsh_version }}" ]; then
            VERSION="${{ inputs.dsh_version }}"
          else
            VERSION="$(npm view @deepseek-ai/dsh version)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved DSH version: $VERSION"
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.resolve.outputs.version }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.resolve.outputs.version }}
