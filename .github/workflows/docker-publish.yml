# Build + publish to GHCR, tracking the official upstream release.
# The dsh version is NOT pinned: each run resolves npm's `latest`
# dist-tag for @deepseek-ai/dsh (the same version `npx @deepseek-ai/dsh`
# installs), builds that exact version, and tags the image with it.
# A weekly scheduled run picks up new upstream releases automatically.
name: Build and publish

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "DSH version to build (empty = npm latest, or use 'latest' keyword)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve upstream dsh version
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.dsh_version }}
        run: |
          # If user provided "latest" keyword or empty, resolve npm's latest dist-tag
          if [ -z "$REQUESTED_VERSION" ] || [ "$REQUESTED_VERSION" = "latest" ]; then
            VERSION="$(npm view @deepseek-ai/dsh version)"
            NPM_LATEST="$VERSION"
          else
            VERSION="$REQUESTED_VERSION"
            NPM_LATEST="$(npm view @deepseek-ai/dsh version)"
          fi

          # Output is_latest=true only if the resolved version equals npm's latest
          if [ "$VERSION" = "$NPM_LATEST" ]; then
            IS_LATEST=true
          else
            IS_LATEST=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_latest=$IS_LATEST" >> "$GITHUB_OUTPUT"
          echo "Resolved DSH version: $VERSION (npm latest: $NPM_LATEST, is_latest: $IS_LATEST)"
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ steps.resolve.outputs.is_latest == 'true' }}
            type=raw,value=${{ steps.resolve.outputs.version }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.resolve.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
