# Build + publish to GHCR, tracking the official upstream release.
# The dsh version is NOT pinned: each run resolves npm's `latest`
# dist-tag for @deepseek-ai/dsh (the same version `npx @deepseek-ai/dsh`
# installs), builds that exact version, and tags the image with it.
# A weekly scheduled run picks up new upstream releases automatically.
name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "DSH version to build (empty = npm latest)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# A push and the weekly schedule both publish the `latest` tag; serialise them
# so two builds can never interleave pushes. cancel-in-progress is off: a run
# that is already pushing should finish rather than leave a half-updated tag.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream dsh version
        id: resolve
        env:
          # The dispatch input reaches the shell through the environment, never
          # spliced into the script text: `${{ inputs.* }}` interpolated into a
          # `run:` block is a command-injection sink for anyone who can dispatch.
          INPUT_VERSION: ${{ inputs.dsh_version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(npm view @deepseek-ai/dsh version)"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not resolve a dsh version (set dsh_version or check npm access)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved DSH version: $VERSION"
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # Order matters: metadata-action derives its version label from the
          # first tag, so the exact version has to come before `latest` or every
          # image claims to be "latest". `type=sha` expands to sha-<short sha>.
          tags: |
            type=raw,value=${{ steps.resolve.outputs.version }}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without the GHA layer cache both platforms redo the apt + npm install
          # from scratch on every run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DSH_VERSION=${{ steps.resolve.outputs.version }}
      - name: Smoke test the published image
        # "It built" is not "it starts": pull the image that was just pushed and
        # run the CLI. metadata-action's type=sha tag is sha-<first 7 of SHA>.
        # `${GITHUB_REPOSITORY,,}`: GitHub keeps the owner's casing (LINKKDON),
        # but an image reference path must be lowercase and metadata-action already
        # lowercases it before pushing, so the smoke run has to lowercase it too.
        shell: bash
        run: docker run --rm "ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}" --version
